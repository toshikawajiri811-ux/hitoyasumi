<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ながの ひと休み</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&display=swap">
<style>
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16201C; --muted:#44524C; --line:#C9D2CC;
  --accent:#0A5566; --accent-ink:#FFFFFF; --accent-soft:#DCEBEE;
  --open:#17663A; --open-bg:#DDF0E3; --closed:#8A2F24; --closed-bg:#F6E3DF;
  --unknown-bg:#E8ECE9; --note-bg:#FFF4D6; --note-ink:#5A4300;
  --radius:14px;
  font-size:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101614; --surface:#1A2320; --ink:#EEF3F0; --muted:#B7C4BE; --line:#34423C;
    --accent:#72C6D6; --accent-ink:#06262D; --accent-soft:#16343A;
    --open:#86DDA6; --open-bg:#173A26; --closed:#F4A99B; --closed-bg:#3E1F1A;
    --unknown-bg:#26302C; --note-bg:#3A3218; --note-ink:#FFE7A3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101614; --surface:#1A2320; --ink:#EEF3F0; --muted:#B7C4BE; --line:#34423C;
  --accent:#72C6D6; --accent-ink:#06262D; --accent-soft:#16343A;
  --open:#86DDA6; --open-bg:#173A26; --closed:#F4A99B; --closed-bg:#3E1F1A;
  --unknown-bg:#26302C; --note-bg:#3A3218; --note-ink:#FFE7A3;
}
:root.big{font-size:25px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  font-size:1rem; line-height:1.6;
}
.wrap{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:12px 96px}
h1,h2,h3{margin:0; text-wrap:balance; line-height:1.35}
.brand{font-family:"BIZ UDPMincho","Hiragino Mincho ProN","Yu Mincho",serif; font-size:1.6rem; letter-spacing:.04em}
.sub{color:var(--muted); font-size:.9rem}
button,a.btn,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--accent); outline-offset:3px}

/* big buttons */
.btn{
  display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%;
  min-height:2.9rem; padding:.7rem 1rem; border-radius:var(--radius);
  border:2px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:1.05rem; text-decoration:none; text-align:center;
}
.btn.ghost{background:var(--surface); color:var(--accent)}
.btn.quiet{background:transparent; border-color:var(--line); color:var(--ink); font-weight:400}
.btn-mode{flex-direction:column; align-items:flex-start; text-align:left; padding:1rem 1.1rem; min-height:5rem}
.btn-mode .big{font-size:1.3rem}
.btn-mode .small{font-weight:400; font-size:.85rem; opacity:.92}
.stack{display:flex; flex-direction:column; gap:.75rem}
.row{display:flex; gap:.6rem; flex-wrap:wrap}
.row > *{flex:1 1 8rem}

.topbar{display:flex; align-items:center; gap:.6rem; padding-block:.4rem .8rem}
.back{flex:0 0 auto; width:auto; min-height:2.6rem; padding:.4rem .9rem}
.topbar h2{font-size:1.25rem}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:1rem}
.note{background:var(--note-bg); color:var(--note-ink); border-radius:var(--radius); padding:.7rem .9rem; font-size:.88rem}

.chips{display:flex; gap:.5rem; flex-wrap:wrap}
.chip{
  min-height:2.6rem; padding:.35rem .9rem; border-radius:999px;
  border:2px solid var(--line); background:var(--surface); color:var(--ink); font-size:.95rem;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip[aria-pressed="true"]::before{content:"✓ "}

/* list */
.list{display:flex; flex-direction:column; gap:.75rem; margin-top:.9rem}
.card{
  display:block; width:100%; text-align:left; color:var(--ink);
  background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem;
}
.card:active{border-color:var(--accent)}
.card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:.6rem}
.card-name{font-size:1.2rem; font-weight:700; line-height:1.35}
.meta{color:var(--muted); font-size:.9rem; margin-top:.2rem; font-variant-numeric:tabular-nums}
.badges{display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem}
.badge{font-size:.8rem; padding:.1rem .55rem; border-radius:6px; background:var(--accent-soft); color:var(--ink); border:1px solid var(--line)}
.reason{margin-top:.5rem; font-size:.88rem; color:var(--accent); font-weight:700}
.status{flex:0 0 auto; font-weight:700; font-size:.9rem; padding:.2rem .6rem; border-radius:8px; white-space:nowrap}
.status.open{background:var(--open-bg); color:var(--open)}
.status.closed{background:var(--closed-bg); color:var(--closed)}
.status.unknown{background:var(--unknown-bg); color:var(--muted)}
.status.open::before{content:"● "}
.status.closed::before{content:"✕ "}
.sample-tag{font-size:.72rem; color:var(--muted); border:1px dashed var(--line); border-radius:6px; padding:0 .35rem; margin-left:.3rem; vertical-align:middle; font-weight:400}

/* detail */
.photo{width:100%; aspect-ratio:16/9; max-width:100%; object-fit:cover; border-radius:var(--radius); background:var(--accent-soft)}
.photo-ph{display:flex; align-items:center; justify-content:center; font-family:"BIZ UDPMincho",serif; font-size:1.6rem; color:var(--accent); border:1px solid var(--line)}
.detail-name{font-size:1.5rem}
.sec-title{font-size:1.05rem; margin-bottom:.5rem}
.kv{display:grid; grid-template-columns:auto 1fr; gap:.45rem 1rem; align-items:baseline}
.kv dt{color:var(--muted); font-size:.9rem}
.kv dd{margin:0; font-weight:700}
.menu{list-style:none; margin:0; padding:0}
.menu li{display:flex; justify-content:space-between; gap:1rem; padding:.45rem 0; border-bottom:1px dotted var(--line); font-variant-numeric:tabular-nums}
.menu li:last-child{border-bottom:0}
.soft{margin-top:.6rem; font-size:.9rem}
.yes{color:var(--open)} .no{color:var(--closed)} .unk{color:var(--muted); font-weight:400}

/* review */
.faces{display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem}
.face{
  display:flex; flex-direction:column; align-items:center; gap:.2rem; padding:.9rem .3rem;
  border:2px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink);
}
.face .mark{font-size:2.2rem; line-height:1; font-family:"BIZ UDPMincho",serif}
.face .lbl{font-weight:700}
.face[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); outline:3px solid var(--accent)}

.hist li{padding:.4rem 0; border-bottom:1px dotted var(--line); display:flex; justify-content:space-between; gap:.6rem}
.hist{list-style:none; padding:0; margin:0}

details summary{cursor:pointer; min-height:2.4rem; display:flex; align-items:center; color:var(--muted)}
input[type=text],input[type=password]{width:100%; min-height:2.6rem; padding:.4rem .7rem; border:2px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink)}
label{font-size:.9rem; color:var(--muted)}

.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  background:var(--ink); color:var(--bg); padding:.7rem 1.1rem; border-radius:12px;
  max-width:calc(100% - 32px); font-weight:700; z-index:10;
}
.empty{padding:1.2rem; text-align:center; color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .card,.btn,.chip,.face{transition:border-color .15s, background .15s} }
</style>
</head>

<div class="wrap">

  <!-- ホーム -->
  <section id="v-home" class="stack">
    <header class="stack" style="gap:.2rem; padding-top:.4rem">
      <h1 class="brand">ながの ひと休み</h1>

    <div id="pending-box" class="panel stack" hidden></div>

    </div>

      <div class="stack" style="margin-top:.6rem">
        <label for="api-key">Places API キー</label>
        <input type="password" id="api-key" autocomplete="off" placeholder="AIza…">

        <input type="text" inputmode="numeric" id="daily-limit" placeholder="30">
        <p class="sub" style="margin:0" id="usage-text"></p>
        <div class="row">
          <button class="btn" id="save-key">保存する</button>
          <button class="btn ghost" id="clear-key">見本に戻す</button>
        </div>
        <p class="sub" style="margin:0">キーはこの端末の中だけに保存されます。Claude上のプレビューではGoogleへの接続ができないため、ご自身のサイトに置いたときに使えます。</p>
      </div>
    </details>
  </section>

  <!-- 一覧 -->
  <section id="v-list" hidden>
    <div class="topbar">
      <button class="btn quiet back" data-back="home">← 戻る</button>
      <h2 id="list-title">お店を探す</h2>
    </div>
    <div class="stack" style="gap:.6rem">
      <div id="area-chips" class="chips" aria-label="エリア"></div>
      <div class="chips" aria-label="しぼりこみ">
        <button class="chip" id="f-open" aria-pressed="false">営業中だけ</button>
        <button class="chip" id="f-wheel" aria-pressed="false">車椅子で入れる</button>
        <button class="chip" id="f-cafe" aria-pressed="false">カフェ・甘味</button>
        <button class="chip" id="f-meal" aria-pressed="false">お食事</button>
      </div>
      <div id="list-msg" class="note" hidden></div>
      <div class="sub" id="list-count"></div>
    </div>
    <div id="list" class="list"></div>
  </section>

  <!-- 詳細 -->
  <section id="v-detail" hidden>
    <div class="topbar">
      <button class="btn quiet back" data-back="list">← 一覧へ</button>
    </div>
    <div id="detail" class="stack"></div>
  </section>

  <!-- 評価 -->
  <section id="v-review" hidden>
    <div class="topbar">
      <button class="btn quiet back" data-back="home">← やめる</button>
      <h2>行ったお店の感想</h2>
    </div>
    <div class="stack">
      <p style="margin:0"><strong id="rv-name"></strong> はいかがでしたか？</p>
      <div class="faces" role="group" aria-label="感想">
        <button class="face" data-r="1" aria-pressed="false"><span class="mark">◎</span><span class="lbl">よかった</span></button>
        <button class="face" data-r="0" aria-pressed="false"><span class="mark">○</span><span class="lbl">ふつう</span></button>
        <button class="face" data-r="-1" aria-pressed="false"><span class="mark">△</span><span class="lbl">いまいち</span></button>
      </div>
      <p class="sub" style="margin:0">よかったところ（いくつでも・なくてもOK）</p>
      <div class="chips" id="rv-tags"></div>
      <button class="btn" id="rv-save" disabled>これで記録する</button>
    </div>
  </section>

  <!-- 記録 -->
  <section id="v-history" hidden>
    <div class="topbar">
      <button class="btn quiet back" data-back="home">← 戻る</button>
      <h2>わたしの記録</h2>
    </div>
    <div class="panel"><ul class="hist" id="hist"></ul></div>
    <p class="sub">記録は次のおすすめの順番に使われます。「いまいち」のお店は一覧の下のほうに出ます。</p>
  </section>

</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

/* ---------- 時刻（日本時間） ---------- */
function nowJP(){
  const f = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false,month:"numeric",day:"numeric"});
  const p = {}; f.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  const h = parseInt(p.hour,10)%24, m = parseInt(p.minute,10);
  return {wd, mins:h*60+m, h, m, month:p.month, day:p.day};
}
const WD_JA = ["日","月","火","水","木","金","土"];
function toMin(s){ const [h,m]=s.split(":").map(Number); return h*60+m; }

/* ---------- 距離 ---------- */
function distM(a,b){
  const R=6371000, t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function distText(d){
  if(d<1000){ return "約"+(Math.round(d/10)*10)+"m・歩いて"+Math.max(1,Math.round(d/70))+"分"; }
  if(d<3000){ return "約"+(d/1000).toFixed(1)+"km・歩いて"+Math.round(d/70)+"分"; }
  return "約"+(d/1000).toFixed(d<10000?1:0)+"km・車で約"+Math.max(5,Math.round(d/1000*2+3))+"分";
}

/* ---------- データ整形 ---------- */
function fromSample(s){
  const n = nowJP();
  const closedToday = s.h.off.includes(n.wd);
  const open = !closedToday && n.mins>=toMin(s.h.o) && n.mins<toMin(s.h.c);
  return {
    id:s.id, name:s.name, typeKey:s.type, typeLabel:TYPE_LABEL[s.type], kind:CAFE_TYPES.has(s.type)?"cafe":"meal",
    lat:s.lat, lng:s.lng, addr:s.addr, open, today: closedToday ? "今日は定休日" : ("今日 "+s.h.o+"〜"+s.h.c),
    offText: s.h.off.length ? ("定休日："+s.h.off.map(d=>WD_JA[d]+"曜").join("・")) : "定休日：なし",
    price:s.price, rating:s.rating, acc:s.acc, restroom:s.restroom, menu:s.menu, soft:s.soft, phone:s.phone, ig:s.ig||null,
    website:null, photo:null, sample:true
  };
}
const PRICE = {PRICE_LEVEL_FREE:0,PRICE_LEVEL_INEXPENSIVE:1,PRICE_LEVEL_MODERATE:2,PRICE_LEVEL_EXPENSIVE:3,PRICE_LEVEL_VERY_EXPENSIVE:4};
function fromLive(p){
  const n = nowJP();
  const coh = p.currentOpeningHours || p.regularOpeningHours;
  const desc = coh && coh.weekdayDescriptions ? coh.weekdayDescriptions[(n.wd+6)%7] : null; // Googleは月曜はじまり
  const a = p.accessibilityOptions || {};
  const type = p.primaryType || "restaurant";
  return {
    id:p.id, name:(p.displayName&&p.displayName.text)||"（名前なし）", typeKey:type,
    typeLabel:(p.primaryTypeDisplayName&&p.primaryTypeDisplayName.text)||"飲食店",
    kind:CAFE_TYPES.has(type)?"cafe":"meal",
    lat:p.location.latitude, lng:p.location.longitude, addr:(p.formattedAddress||"").replace(/^日本、(〒\d{3}-\d{4} )?/,""),
    open: (p.currentOpeningHours && typeof p.currentOpeningHours.openNow==="boolean") ? p.currentOpeningHours.openNow : null,
    today: desc ? desc.replace(/^[^:：]+[:：]\s*/,"今日 ") : "営業時間の情報なし", offText:"",
    price: PRICE[p.priceLevel] ?? null, rating:p.rating ?? null,
    acc:{entrance:a.wheelchairAccessibleEntrance ?? null, restroom:a.wheelchairAccessibleRestroom ?? null, seating:a.wheelchairAccessibleSeating ?? null,
         parking: a.wheelchairAccessibleParking ?? (p.parkingOptions ? !!(p.parkingOptions.freeParkingLot||p.parkingOptions.paidParkingLot||p.parkingOptions.freeStreetParking) : null)},
    restroom:p.restroom ?? null, menu:null, soft:null, phone:p.nationalPhoneNumber||null, website:p.websiteUri||null, ig:null,
    photo:(p.photos&&p.photos[0]) ? p.photos[0].name : null, sample:false
  };
}

/* ---------- 検索 ---------- */
const state = {mode:"city", area:AREAS[0], center:NAGANO, radius:50000, places:[], filters:{open:false,wheel:false,cafe:false,meal:false}, cur:null, msg:""};

/* 無料枠を守るしくみ：1日の上限・同じ場所の再検索はしない・項目を段階的に減らして再試行 */
const FIELDS_BASE = ["id","displayName","formattedAddress","location","primaryType","primaryTypeDisplayName","businessStatus",
  "currentOpeningHours","regularOpeningHours","priceLevel","rating","websiteUri","nationalPhoneNumber"];
const FIELD_LEVELS = [
  FIELDS_BASE.concat(["photos","accessibilityOptions","restroom","parkingOptions"]),
  FIELDS_BASE.concat(["accessibilityOptions","restroom","parkingOptions"]), // デモキーは写真なし
  FIELDS_BASE
];
function todayKey(){ const n=nowJP(); return n.month+"/"+n.day; }
function usage(){ let u = LS.get("usage",null); if(!u || u.date!==todayKey()) u = {date:todayKey(), search:0, photo:0}; return u; }
function bump(kind){ const u = usage(); u[kind]++; LS.set("usage",u); }
function dailyLimit(){ return Math.max(1, parseInt(settings.limit,10) || 30); }
const cache = new Map();

async function searchLive(){
  const ck = state.center.lat.toFixed(3)+","+state.center.lng.toFixed(3)+","+state.radius+","+state.mode;
  const hit = cache.get(ck);
  if(hit && Date.now()-hit.at < 30*60e3){ return hit.places; }
  if(usage().search >= dailyLimit()){ throw new Error("今日の検索回数の上限（"+dailyLimit()+"回）に達しました。明日また使えます"); }
  let level = Math.min(settings.fieldLevel||0, FIELD_LEVELS.length-1), lastErr = "";
  for(; level<FIELD_LEVELS.length; level++){
    bump("search");
    const res = await fetch("https://places.googleapis.com/v1/places:searchNearby",{
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":settings.key,
        "X-Goog-FieldMask":FIELD_LEVELS[level].map(f=>"places."+f).join(",")},
      body:JSON.stringify({
        includedTypes:["restaurant","cafe","coffee_shop","tea_house"],
        maxResultCount:20, languageCode:"ja", regionCode:"JP",
        rankPreference: state.mode==="here" ? "DISTANCE" : "POPULARITY",
        locationRestriction:{circle:{center:{latitude:state.center.lat,longitude:state.center.lng},radius:state.radius}}
      })
    });
    if(res.ok){
      if((settings.fieldLevel||0)!==level){ settings.fieldLevel=level; LS.set("settings",settings); }
      const j = await res.json();
      const places = (j.places||[]).filter(p=>p.businessStatus!=="CLOSED_PERMANENTLY" && p.location).map(fromLive);
      cache.set(ck,{at:Date.now(),places});
      return places;
    }
    let detail = ""; try{ const j = await res.json(); detail = (j.error&&j.error.message)||""; }catch(e){}
    lastErr = "Googleの応答 "+res.status+(detail?"："+detail:"");
    if(res.status!==400 && res.status!==403) break; // 項目の問題でなければ再試行しない
    if(usage().search >= dailyLimit()) break;
  }
  throw new Error(lastErr);
}
function searchSample(){
  return SAMPLE.map(fromSample).filter(p=>distM(state.center,p)<=state.radius);
}
async function runSearch(){
  state.msg = "";
  if(settings.key){
    try{ state.places = await searchLive(); }
    catch(e){ state.msg = "Googleからお店を取得できませんでした（"+e.message+"）。見本のお店を表示しています。"; state.places = searchSample(); }
  }else{
    state.places = searchSample();
  }
  renderList();
}

/* ---------- おすすめ計算 ---------- */
function prefs(){
  const type = {}, tags = {}; let tagTotal = 0;
  Object.values(reviews).forEach(v=>{
    type[v.typeKey] = type[v.typeKey] || {sum:0,n:0};
    type[v.typeKey].sum += v.r; type[v.typeKey].n += 1;
    if(v.r===1){ (v.tags||[]).forEach(t=>{ tags[t]=(tags[t]||0)+1; tagTotal++; }); }
  });
  return {type, tags, tagTotal};
}
function tagSatisfied(t,p){
  switch(t){
    case "入りやすい": return p.acc.entrance===true;
    case "席・トイレが楽": return p.acc.restroom===true || p.acc.seating===true;
    case "値段が手ごろ": return p.price!=null && p.price<=1;
    case "静か": return p.kind==="cafe";
    default: return p.rating!=null && p.rating>=4.2; // 味・店員さん
  }
}
function scorePlace(p, pr){
  const d = distM(state.center,p);
  const near = Math.max(0, 1 - d/state.radius);
  const t = pr.type[p.typeKey]; const type = t ? t.sum/(t.n+2) : 0;
  const rv = reviews[p.id]; const shop = rv ? rv.r : 0;
  let match = 0;
  if(pr.tagTotal){ let s=0; for(const k in pr.tags){ if(tagSatisfied(k,p)) s+=pr.tags[k]; } match = s/pr.tagTotal; }
  const open = p.open===true ? 1 : 0;
  const score = 40*near + 25*type + 20*shop + 15*match + 30*open;
  const why = [];
  if(p.open===true) why.push("営業中");
  if(d<500) why.push("すぐ近く");
  if(rv && rv.r===1) why.push("前回「よかった」");
  if(type>0.15) why.push("お好みの"+p.typeLabel);
  if(match>=0.5) why.push("好みに合う特徴");
  return {d, score, bad: rv && rv.r===-1, why};
}
function ranked(){
  const pr = prefs(), f = state.filters;
  let list = state.places.map(p=>Object.assign({},p,scorePlace(p,pr)));
  if(f.open) list = list.filter(p=>p.open===true);
  if(f.wheel) list = list.filter(p=>p.acc.entrance===true);
  if(f.cafe && !f.meal) list = list.filter(p=>p.kind==="cafe");
  if(f.meal && !f.cafe) list = list.filter(p=>p.kind==="meal");
  list.sort((a,b)=> (a.bad-b.bad) || (b.score-a.score));
  // 上位5件に「まだ行ったことのないお店」を必ず1件
  const top = list.slice(0,5);
  if(top.length===5 && top.every(p=>reviews[p.id])){
    const i = list.findIndex((p,idx)=>idx>=5 && !reviews[p.id]);
    if(i>0){ const [x]=list.splice(i,1); x.why=["はじめてのお店"].concat(x.why); list.splice(4,0,x); }
  }
  return list;
}

}
function renderHistory(){
  const items = Object.entries(reviews).sort((a,b)=>b[1].at-a[1].at);
  $("hist").innerHTML = items.length ? items.map(([id,v])=>{
    const d = new Date(v.at);
    return '<li><span><strong>'+esc(v.name)+'</strong>'+(v.sample?'<span class="sample-tag">見本の記録</span>':'')+'<br><span class="sub">'+(d.getMonth()+1)+'月'+d.getDate()+'日'+(v.tags&&v.tags.length?'・'+esc(v.tags.join("、")):'')+'</span></span><span>'+["△ いまいち","○ ふつう","◎ よかった"][v.r+1]+'</span></li>';
  }).join("") : '<li class="empty">まだ記録はありません。お店に行ったら感想をどうぞ。</li>';
  show("history");
}

/* ---------- 操作 ---------- */
function applyFont(){ document.documentElement.classList.toggle("big", !!settings.big); }

$("go-city").addEventListener("click", ()=>{
  state.mode="city"; state.area=AREAS[0]; state.center=NAGANO; state.radius=50000;
  show("list"); $("list").innerHTML='<div class="empty">お店を探しています…</div>'; runSearch();
});
$("go-here").addEventListener("click", ()=>{
  state.mode="here"; state.radius=5000;
  show("list"); $("list").innerHTML='<div class="empty">現在地を確認しています…</div>';
  const fallback = (why)=>{
    state.center = NAGANO_STA; runSearch().then(()=>{
      state.msg = why+"長野駅を現在地として表示しています。"; $("list-msg").hidden=false; $("list-msg").textContent=state.msg;
    });
  };
  if(!navigator.geolocation){ fallback("この端末では位置情報が使えないため、"); return; }
  let done = false;
  const timer = setTimeout(()=>{ if(!done){ done=true; fallback("現在地がわからなかったため、"); } }, 8000);
  try{
    navigator.geolocation.getCurrentPosition(pos=>{
      if(done) return; done=true; clearTimeout(timer);
      state.center = {lat:pos.coords.latitude, lng:pos.coords.longitude, label:"現在地"}; runSearch();
    }, ()=>{ if(done) return; done=true; clearTimeout(timer); fallback("位置情報の利用が許可されていないため、"); },
    {enableHighAccuracy:true, timeout:7000, maximumAge:60000});
  }catch(e){ if(!done){ done=true; clearTimeout(timer); fallback("位置情報が使えないため、"); } }
});

document.addEventListener("click", e=>{
  const t = e.target.closest("button, a");
  if(!t) return;
  if(t.dataset.back){ show(t.dataset.back); if(t.dataset.back==="list") renderList(); return; }
  if(t.dataset.id){ const p = ranked().find(x=>x.id===t.dataset.id); if(p) renderDetail(p); return; }
  if(t.dataset.area){
    const a = AREAS.find(x=>x.id===t.dataset.area);
    state.area=a; state.center={lat:a.lat,lng:a.lng,label:a.id==="all"?"長野市役所":a.label}; state.radius=a.r;
    $("list").innerHTML='<div class="empty">お店を探しています…</div>'; runSearch(); return;
  }
  if(t.hasAttribute("data-go") && state.cur){
    const p = state.cur;
    if(!reviews[p.id] || Date.now()-reviews[p.id].at > 3600e3){
      pending[p.id] = {name:p.name, typeKey:p.typeKey, kind:p.kind, at:Date.now()}; LS.set("pending",pending);
    }
    return; // リンクはそのまま開く
  }
  if(t.id==="to-review" && state.cur){ openReview(state.cur.id); return; }
  if(t.id==="ig-save" && state.cur){
    const v = ($("ig-input").value||"").trim().replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/\/.*$/,"");
    if(v){ igLinks[state.cur.id] = v; LS.set("igLinks",igLinks); renderDetail(state.cur); toast("Instagramを登録しました"); }
    return;
  }
  if(t.id==="ig-edit" && state.cur){ delete igLinks[state.cur.id]; LS.set("igLinks",igLinks); renderDetail(state.cur); return; }
  if(t.dataset.review){ openReview(t.dataset.review); return; }
  if(t.classList.contains("face")){
    document.querySelectorAll(".face").forEach(b=>b.setAttribute("aria-pressed", b===t ? "true":"false"));
    rv.r = parseInt(t.dataset.r,10); $("rv-save").disabled = false; return;
  }
  if(t.dataset.tag){
    const on = t.getAttribute("aria-pressed")!=="true"; t.setAttribute("aria-pressed", on);
    rv.tags = on ? rv.tags.concat(t.dataset.tag) : rv.tags.filter(x=>x!==t.dataset.tag); return;
  }
});
["open","wheel","cafe","meal"].forEach(k=>{
  $("f-"+k).addEventListener("click", e=>{
    state.filters[k] = !state.filters[k]; e.currentTarget.setAttribute("aria-pressed", state.filters[k]); renderList();
  });
});
$("rv-save").addEventListener("click", ()=>{
  if(rv.r===null) return;
  reviews[rv.id] = {r:rv.r, tags:rv.tags, typeKey:rv.info.typeKey, kind:rv.info.kind, name:rv.info.name, at:Date.now()};
  delete pending[rv.id];
  LS.set("reviews",reviews); LS.set("pending",pending);
  show("home"); toast("記録しました。次のおすすめに反映します");
});
$("go-history").addEventListener("click", renderHistory);
$("font-toggle").addEventListener("click", ()=>{ settings.big=!settings.big; LS.set("settings",settings); applyFont(); renderHome(); });
$("save-key").addEventListener("click", ()=>{
  settings.key = $("api-key").value.trim(); settings.limit = parseInt($("daily-limit").value,10) || 30; settings.fieldLevel = 0;
  cache.clear(); LS.set("settings",settings); renderHome();
  toast(settings.key ? "キーを保存しました" : "キーが空です");
});
$("clear-key").addEventListener("click", ()=>{ settings.key=""; $("api-key").value=""; LS.set("settings",settings); renderHome(); toast("見本のお店に戻しました"); });

/* 初回：見本の記録を入れて、おすすめの効き方を見せる */
if(!LS.get("seeded",false) && !Object.keys(reviews).length){
  const t0 = Date.now()-86400e3*3;
  reviews = {
    s02:{r:1,tags:["味がよい","入りやすい"],typeKey:"soba",kind:"meal",name:"そば処 ゆきやま",at:t0,sample:true},
    s06:{r:-1,tags:[],typeKey:"cafe",kind:"cafe",name:"珈琲 りんご舎",at:t0-86400e3,sample:true}
  };
  pending = {s04:{name:"まちかど食堂 すずらん",typeKey:"teishoku",kind:"meal",at:Date.now()-3600e3}};
  LS.set("reviews",reviews); LS.set("pending",pending); LS.set("seeded",true);
}
$("api-key").value = settings.key || "";
$("daily-limit").value = settings.limit || 30;
applyFont();
show("home");
})();
</script>
</body>
